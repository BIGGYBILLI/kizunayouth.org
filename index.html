<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4eee1" />
    <script>
      // Applied before first paint so a dark-mode visitor never sees a cream flash.
      (function () {
        try {
          var stored = localStorage.getItem('kizuna-theme')
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) {
            document.documentElement.classList.add('dark')
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#02110c')
          }
        } catch (e) {
          /* no storage: fall back to the light theme */
        }
      })()
    </script>
    <title>Kizuna Youth Project — Guiding students to Japan</title>
    <meta
      name="description"
      content="Kizuna Youth Project is a student-led consultancy guiding young people from India, the Philippines and Bangladesh into Japanese universities: language, scholarships, applications and free school workshops."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300&family=Inter+Tight:wght@400;500&family=Playfair+Display:ital,wght@0,400;1,400&family=Shippori+Mincho:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
